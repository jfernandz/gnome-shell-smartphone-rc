<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Smartphone Remote Control</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header><h1>Remote Control</h1><p id="status" role="status">Ready to connect</p></header>
  <nav aria-label="Connection controls">
    <button id="connect" disabled>Connect</button>
    <button id="keyboard" disabled>Keyboard</button>
    <button id="disconnect" disabled>Disconnect</button>
  </nav>
  <section class="pointer-settings" aria-label="Touchpad settings">
    <div><label for="sensitivity">Sensitivity</label><output id="sensitivity-value" for="sensitivity">1.0×</output></div>
    <input id="sensitivity" type="range" min="0.5" max="10" step="0.5" value="1">
  </section>
  <main id="touchpad" aria-label="Touchpad"><span>Slide to move · Tap to click<br>Two fingers to scroll</span></main>
  <section id="typing" hidden>
    <label for="text">Typing on your PC</label>
    <form id="text-form"><input id="text" type="text" autocomplete="off" spellcheck="false" enterkeyhint="enter" placeholder="Type here — changes appear on your PC" maxlength="65536"></form>
    <p class="hint">Shows text typed from this phone. Tap here if the keyboard stays closed.</p>
  </section>
  <footer><button id="left" disabled>Left click</button><button id="right" disabled>Right click</button></footer>
</body>
</html>
