name: Publication preparation

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to prepare (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    container: archlinux:base
    timeout-minutes: 20
    steps:
      - name: Install preparation dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          nodejs git tar unzip gjs libsoup3 glib2 glib-networking gnome-shell
          openssl iproute2 util-linux chromium imagemagick noto-fonts
      - uses: actions/checkout@v7
        with:
          # Use current preparation tooling; release source comes only from the tag.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare tagged artifacts with an unprivileged browser
        env:
          PUBLICATION_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          useradd --create-home publication
          chown -R publication:publication "$GITHUB_WORKSPACE"
          # Allow Chromium in the disposable container without host namespace privileges.
          # Keep this exception in CI; tagged source and local browser defaults stay intact.
          install -d -o publication -g publication /tmp/publication-browser
          cat > /tmp/publication-browser/chromium <<'BROWSER'
          #!/usr/bin/env bash
          set -euo pipefail
          exec /usr/bin/chromium --no-sandbox "$@" 2> >(tee -a "$SMARTPHONE_RC_CHROMIUM_LOG" >&2)
          BROWSER
          chmod 755 /tmp/publication-browser/chromium
          export SMARTPHONE_RC_CHROMIUM_BIN=/tmp/publication-browser/chromium
          export SMARTPHONE_RC_CHROMIUM_LOG="$GITHUB_WORKSPACE/dist/publication/logs/chromium-startup.txt"
          runuser -u publication -- node scripts/prepare-publication.mjs "$PUBLICATION_TAG" dist/publication
      - name: Upload preparation bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publication-${{ inputs.tag || github.ref_name }}
          path: dist/publication/
          if-no-files-found: error
          retention-days: 30
