name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Lint and tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    # The server tests need libsoup >= 3.8, unavailable in Ubuntu 24.04.
    container: archlinux:base
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Install native test dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          git actionlint gjs libsoup3 glib2 glib-networking gnome-shell
          openssl iproute2 util-linux unzip
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Lint workflows
        run: npm run lint:actions
      - name: Lint
        run: npm run lint
      - name: Run automated tests (including ZIP validation)
        run: npm test
