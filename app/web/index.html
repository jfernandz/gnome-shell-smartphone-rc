<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content, viewport-fit=cover">
  <title>Smartphone Remote Control</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <button id="controls-toggle" popovertarget="controls" aria-label="Controls">•••</button>
  <main id="touchpad" aria-label="Touchpad" aria-describedby="touchpad-help"><span id="touchpad-help">Slide to move · Tap to click<br>Hold for right click · Two fingers to scroll</span></main>
  <section id="typing" aria-label="Phone keyboard" hidden>
    <label for="text">Typing on your PC</label>
    <form id="text-form"><input id="text" aria-describedby="typing-hint" type="text" autocomplete="off" spellcheck="false" enterkeyhint="enter" placeholder="Type here — changes appear on your PC" maxlength="65536"></form>
    <p id="typing-hint" class="hint">Shows text typed from this phone. Tap here if the keyboard stays closed.</p>
  </section>
  <div id="controls" popover aria-label="Remote controls">
    <header><p id="status" role="status">Ready to connect</p></header>
  <nav aria-label="Connection controls">
    <button id="connect" disabled>Connect</button>
    <button id="keyboard" aria-controls="typing" aria-expanded="false" disabled>Keyboard</button>
    <button id="disconnect" disabled>Disconnect</button>
  </nav>
  <section class="pointer-settings" aria-label="Touchpad settings">
    <div><label for="sensitivity">Sensitivity</label><output id="sensitivity-value" for="sensitivity" aria-hidden="true">1.0×</output></div>
    <input id="sensitivity" type="range" min="0.5" max="10" step="0.5" value="1">
  </section>
  <section class="volume-settings" aria-label="Desktop sound">
    <div class="volume-heading"><label for="volume">Volume</label><output id="volume-value" for="volume" aria-hidden="true">Unavailable</output></div>
    <div class="volume-controls"><input id="volume" type="range" min="0" max="100" step="1" value="0" disabled><button id="mute" aria-pressed="false" disabled>Mute</button></div>
  </section>
  </div>
</body>
</html>
